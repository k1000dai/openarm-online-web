{% extends "base.html" %}
{% block title %}Login - {{ site_name }}{% endblock %}
{% block content %}
  <h1>Login</h1>
  <p>No account is needed: logging in starts a guest session.</p>
  <form method="post" action="{{ url_for('login_guest') }}">
    <button type="submit">Login as guest</button>
  </form>
{% endblock %}
